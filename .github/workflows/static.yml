name: Deploy Potentiometric Map Tutorial to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'potentiometric_map_tutorial/**'
      - '.github/workflows/static.yml'

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar MyST CLI
        run: npm install -g mystmd

      - name: Compilar o site em HTML
        run: cd potentiometric_map_tutorial && myst build --html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload dos arquivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'potentiometric_map_tutorial/_build/html'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

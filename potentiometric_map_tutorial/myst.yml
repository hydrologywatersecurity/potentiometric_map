    - title: "Fundamentos"
      children:
        - file: content/01_conceitos_hidrogeologia.md
        - file: content/02_coleta_dados.md
    - title: "Prática em Python"
      children:
        - file: notebooks/01_processamento_dados.ipynb
        - file: notebooks/02_interpolacao_krigagem.ipynb
        - file: notebooks/03_geracao_mapa_potenciometrico.ipynb

site:
  template: book-theme
  base_url: https://github.com/hydro.watersec/potentiometric_map
  nav:
    - title: GitHub
      url: https://github.com/hydro.watersec/potentiometric_map
  actions:
    - title: Abrir no Colab
      url: https://colab.research.google.com/github/hydro.watersec/potentiometric_map
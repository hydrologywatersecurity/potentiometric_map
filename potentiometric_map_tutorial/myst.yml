  description: Guia prático para interpolação espacial e análise piezométrica em Python.
  authors:
    - name: Bruno Ken Marchezepe
      affiliation: USP São Carlos
  github: https://github.com/hydro.watersec/potentiometric_map
  open_access: true

  # Estrutura do Sumário / Menu Lateral (Table of Contents)
  toc:

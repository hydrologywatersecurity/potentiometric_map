version: 1

project:
  title: Potentiometric Maps Tutorial
  description: Practical guide for spatial interpolation and piezometric analysis in Python.
  authors:
    - name: Bruno Ken Marchezepe
      affiliation: University of São Paulo (USP)
    - name: Paulo Tarso S. Oliveira
      affiliation: University of North Carolina at Charlotte (UNCC)
  github: https://github.com/hydrologywatersecurity/potentiometric_map
  open_access: true

  # Table of Contents structure / Left menu
  toc:
    - file: intro.md
    - title: "Fundamentals"
      children:
        - file: content/01_concepts.md
        - file: content/02_data_collection.md
    - title: "ArcGIS Practice"
      children:
        - file: notebooks/01_data_preprocessing.md
        - file: content/03_kriging_interpolation.md
        - file: content/04_potentiometric_map_generation.md

site:
  template: book-theme
  github: https://github.com/hydrologywatersecurity/potentiometric_map
  nav:
    - title: GitHub
      url: https://github.com/hydrologywatersecurity/potentiometric_map
  actions:
    - title: Open in Colab
      url: https://colab.research.google.com/github/hydrologywatersecurity/potentiometric_map